name: Revenue Agent

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: revenue-agent
  cancel-in-progress: false

jobs:
  scan-and-apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UGIG_API_KEY: ${{ secrets.UGIG_API_KEY }}
      AUTO_APPLY: "true"
      MIN_BUDGET_USD: "25"
      MAX_APPLICATIONS_PER_RUN: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate agent syntax
        run: python -m py_compile agent.py

      - name: Scan and apply
        run: python agent.py
